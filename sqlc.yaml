version: "2"

sql:
  - engine: postgresql
    schema:
      - database/migrations/*.up.sql
    queries:
      - database/queries/*.sql
    gen:
      go:
        package: db
        out: internal/db
        sql_package: "pgx/v5"
        emit_json_tags: true
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "timestamptz"
            go_type:
              import: "time"
              type: "Time"
